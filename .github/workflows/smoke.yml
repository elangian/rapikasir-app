name: Smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Situs production menjawab
        run: |
          URL="https://rapikasir-app.vercel.app"
          code=$(curl -s -o page.html -w "%{http_code}" "$URL")
          echo "HTTP status: $code"
          test "$code" = "200"
          grep -q 'id="root"' page.html
          grep -q 'RapiKasir' page.html
      - name: Supabase terjangkau
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          test -n "$SUPABASE_URL"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/auth/v1/health")
          echo "Supabase HTTP status: $code"
          case "$code" in 200|401) exit 0 ;; *) exit 1 ;; esac
